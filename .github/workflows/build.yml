name: CI

on: [push]

jobs:
  build:
    runs-on: macOS-latest
    env:
      BLINK_COMPLETION_LOOP_DIR: ${{ github.workspace }}/.build/completion-loop/ci-fast

    steps:
    - uses: actions/checkout@v2
      with:
        submodules: true

    - name: switch xcode
      run: sudo xcode-select -s '/Applications/Xcode.app/Contents/Developer'

    - name: use cache
      id: cache
      uses: actions/cache@v2
      with:
        path: |
          xcfs/.build
          Frameworks/ios_system/xcfs/.build
        key: ${{ runner.os }}-${{ hashFiles('get_frameworks.sh', 'xcfs/Package.swift') }}

    - name: get frameworks
      if: steps.cache.outputs.cache-hit != 'true'
      run: ./get_frameworks.sh

    - name: get resources
      if: steps.cache.outputs.cache-hit != 'true'
      run: ./get_resources.sh

    - name: copy xcconfig
      run: cp template_setup.xcconfig developer_setup.xcconfig

    - name: Verify fast (v5)
      run: |
        if [[ -x ./scripts/ios/orchestrate-v5 ]]; then
          ./scripts/ios/orchestrate-v5 \
            --mode fast \
            --ci \
            --allow-no-fixture \
            --report-dir "${BLINK_COMPLETION_LOOP_DIR}"
        else
          ./scripts/ios/verify-fast --ci --allow-no-fixture
        fi

    - name: Upload completion-loop artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: completion-loop-ci-fast
        path: ${{ env.BLINK_COMPLETION_LOOP_DIR }}
        if-no-files-found: warn
